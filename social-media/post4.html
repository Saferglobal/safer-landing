<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Inter';
    src: url('file:///Users/yonatanzlit/safer-landing/assets/fonts/inter-var.woff2') format('woff2-variations');
    font-weight: 100 900;
    font-style: normal;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    position: relative;
    background: #f2f6ff;
    font-family: 'Inter', sans-serif;
  }

  /* ---- headline block (locked template scale/position) ---- */
  .headline {
    position: absolute;
    left: 76px; top: 176px;
    color: #0a1f44;
    font-weight: 860;
    font-size: 176px;
    line-height: 0.94;
    letter-spacing: -0.035em;
    z-index: 3;
  }
  .headline .dot { margin-left: -0.045em; }  /* template rule: tuck the period (flat E before it) */
  .sub {
    position: absolute;
    left: 82px; top: 1024px;
    color: #5a6784;
    font-weight: 520;
    font-size: 33px;
    letter-spacing: -0.01em;
    white-space: nowrap;
    z-index: 3;
  }

  /* ---- hand-drawn family circle (thin action-blue doodle ring) ---- */
  .ring {
    position: absolute;
    left: 645px; top: 660px;    /* 470x470 viewport, ring center (880,895), r~195 */
    width: 470px; height: 470px;
    z-index: 1;
  }

  /* ---- the kid, center-right, big and adorable ---- */
  .char {
    position: absolute;
    left: 545px; top: 620px;
    width: 700px;               /* drawn figure spans ~x738-1033, y707-1140 — inside safe square */
    z-index: 2;
  }

  /* ---- parent avatars sitting ON the ring — thin navy line style, no fills ---- */
  .avatar {
    position: absolute;
    width: 62px; height: 62px;
    border: 5px solid #16233f;
    border-radius: 50%;
    background: #f2f6ff;
    z-index: 2;
  }
  .avatar.mom { left: 680px; top: 767px; }
  .avatar.dad { left: 1009px; top: 752px; }
  .avatar .eye {
    position: absolute;
    width: 7px; height: 7px;
    background: #16233f;
    border-radius: 50%;
    top: 22px;
  }
  .avatar .eye.l { left: 13px; }
  .avatar .eye.r { right: 13px; }
  .avatar .smile {
    position: absolute;
    left: 17px; top: 22px;
    width: 18px; height: 14px;
    border: 4px solid transparent;
    border-bottom-color: #16233f;
    border-radius: 50%;
  }
  .avatar .bun {
    position: absolute;
    left: 19px; top: -14px;
    width: 14px; height: 14px;
    border: 4px solid #16233f;
    border-radius: 50%;
    background: #f2f6ff;
  }

  /* ---- the orb, a member of the circle, ON the ring ---- */
  .orb-member {
    position: absolute;
    left: 983px; top: 974px;    /* centered on the ring, lower-right */
    width: 92px; height: 92px;
    z-index: 2;
    filter: drop-shadow(0 8px 20px rgba(47,107,255,.35));
  }

  /* ---- shared lockup: pixel-identical to Posts 1-3 ---- */
  .lockup {
    position: absolute;
    left: 76px; top: 1108px;
    display: flex; align-items: center; gap: 16px;
    z-index: 3;
  }
  .lockup img {
    width: 64px; height: 64px;
    filter: drop-shadow(0 5px 12px rgba(47,107,255,.45));
  }
  .lockup span {
    color: #0a1f44;
    font-weight: 800;
    font-size: 44px;
    letter-spacing: -0.02em;
  }
</style>
</head>
<body>
  <svg class="ring" viewBox="0 0 470 470" fill="none">
    <!-- hand-drawn feel: wobbled circle (r~195) with a small sketch gap + overlap stroke -->
    <path d="M 235 40 C 341 38, 432 125, 430 235 C 428 344, 342 432, 235 430 C 128 428, 42 342, 40 235 C 38 130, 118 46, 218 40"
          stroke="#2f6bff" stroke-width="6" stroke-linecap="round"/>
    <path d="M 205 44 C 178 49, 152 60, 128 78"
          stroke="#2f6bff" stroke-width="6" stroke-linecap="round" opacity=".85"/>
  </svg>
  <img class="char" src="file:///Users/yonatanzlit/safer-landing/assets/sit-kids.png" alt="">
  <div class="avatar mom"><span class="bun"></span><span class="eye l"></span><span class="eye r"></span><span class="smile"></span></div>
  <div class="avatar dad"><span class="eye l"></span><span class="eye r"></span><span class="smile"></span></div>
  <img class="orb-member" src="file:///Users/yonatanzlit/safer-landing/assets/orb.png" alt="">
  <div class="headline">YOUR<br>WHOLE<br>FAMILY,<br>ONE<br>CIRCLE<span class="dot">.</span></div>
  <div class="sub">Know they got home &mdash; without hovering.</div>
  <div class="lockup">
    <img src="file:///Users/yonatanzlit/safer-landing/assets/orb.png" alt="">
    <span>Safer</span>
  </div>
</body>
</html>
