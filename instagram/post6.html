<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Inter';
    src: url('file:///Users/yonatanzlit/safer-landing/assets/fonts/inter-var.woff2') format('woff2-variations');
    font-weight: 100 900;
    font-style: normal;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    position: relative;
    background: #e7efff;
    font-family: 'Inter', sans-serif;
  }

  /* ---- headline block (locked template scale/position) ---- */
  .headline {
    position: absolute;
    left: 76px; top: 176px;
    color: #0a1f44;
    font-weight: 860;
    font-size: 176px;
    line-height: 0.94;
    letter-spacing: -0.035em;
    z-index: 3;
  }
  .headline .dot { margin-left: -0.045em; }  /* template rule: tuck after flat E */
  .headline .l4 { letter-spacing: -0.05em; } /* CHOOSE. tightened so the period clears her bun */
  .sub {
    position: absolute;
    left: 82px; top: 885px;
    max-width: 470px;
    color: #5a6784;
    font-weight: 520;
    font-size: 34px;
    line-height: 1.35;
    letter-spacing: -0.01em;
    z-index: 3;
  }

  /* ---- character: resting ON the giant phone, lower-right two-thirds ---- */
  .char {
    position: absolute;
    left: 625px; top: 802px;
    width: 450px;              /* 450 x 411 — bottom 1213; scaled to clear the 4-line stack (P3/P4 precedent) */
    z-index: 2;
    filter: drop-shadow(0 18px 40px rgba(16,35,63,.10));
  }

  /* ---- drawn toggle switch, foreshortened into the screen plane ---- */
  .toggle {
    position: absolute;
    left: 824px; top: 1098px;
    width: 107px; height: 41px;
    border: 5px solid #16233f;
    border-radius: 23px;
    transform: rotate(-17deg) skewX(-22deg);
    z-index: 3;
  }
  /* the orb IS the toggle's knob — flipped to ON (right end, toward pin + her hand) */
  .orb-knob {
    position: absolute;
    left: 897px; top: 1080px;
    width: 56px; height: 56px;
    z-index: 4;
    filter: drop-shadow(0 8px 20px rgba(47,107,255,.35));
  }

  /* ---- shared lockup: pixel-identical to Posts 1-5 ---- */
  .lockup {
    position: absolute;
    left: 76px; top: 1108px;
    display: flex; align-items: center; gap: 16px;
    z-index: 3;
  }
  .lockup img {
    width: 64px; height: 64px;
    filter: drop-shadow(0 5px 12px rgba(47,107,255,.45));
  }
  .lockup span {
    color: #0a1f44;
    font-weight: 800;
    font-size: 44px;
    letter-spacing: -0.02em;
  }
</style>
</head>
<body>
  <img class="char" src="file:///Users/yonatanzlit/safer-landing/assets/char-resting.png" alt="">
  <div class="toggle"></div>
  <img class="orb-knob" src="file:///Users/yonatanzlit/safer-landing/assets/orb.png" alt="">
  <div class="headline">SHARED<br>ONLY<br>WHEN YOU<br><span class="l4">CHOOSE<span class="dot">.</span></span></div>
  <div class="sub">Your location is yours &mdash; shared on your terms.</div>
  <div class="lockup">
    <img src="file:///Users/yonatanzlit/safer-landing/assets/orb.png" alt="">
    <span>Safer</span>
  </div>
</body>
</html>
