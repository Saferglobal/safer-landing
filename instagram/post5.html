    position: absolute;
    left: 82px; top: 742px;

    font-weight: 520;

    line-height: 1.35;

    position: absolute;

  .dash.d2 { left: 908px; top: 732px; width: 44px; transform: rotate(-8deg); }
  .dash.d3 { left: 946px; top: 792px; width: 28px; transform: rotate(-16deg); }

  /* ---- shared lockup: pixel-identical to Posts 1-4 ---- */

    position: absolute;
    left: 76px; top: 1108px;
    display: flex; align-items: center; gap: 16px;

  .lockup img {

  .lockup span {
