<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Inter';
    src: url('file:///Users/yonatanzlit/safer-landing/assets/fonts/inter-var.woff2') format('woff2-variations');
    font-weight: 100 900;
    font-style: normal;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    position: relative;
    background: #fbf9f6;
    font-family: 'Inter', sans-serif;
  }

  /* ---- soft-blue blob behind the character (may overflow into bottom bleed) ---- */
  .blob {
    position: absolute;
    left: 400px; top: 596px;
    width: 760px; height: 700px;
    background: #f2f6ff;
    border-radius: 58% 42% 55% 45% / 52% 48% 56% 44%;
  }

  /* ---- headline block (upper-left of safe square) ---- */
  .headline {
    position: absolute;
    left: 76px; top: 176px;
    color: #0a1f44;
    font-weight: 860;
    font-size: 176px;
    line-height: 0.94;
    letter-spacing: -0.035em;
    z-index: 3;
  }
  .headline .walk { letter-spacing: -0.048em; }   /* A/L/K sit wide — optically match NEVER/ALONE */
  .headline .dot  { margin-left: -0.045em; }      /* tuck the period against the E */
  .sub {
    position: absolute;
    left: 82px; top: 742px;
    max-width: 460px;
    color: #5a6784;
    font-weight: 520;
    font-size: 34px;
    line-height: 1.35;
    letter-spacing: -0.01em;
    z-index: 3;
  }

  /* ---- companion orb above/behind her shoulder ---- */
  .orb-companion {
    position: absolute;
    left: 872px; top: 566px;
    width: 128px; height: 128px;
    z-index: 1;
    filter: drop-shadow(0 10px 24px rgba(47,107,255,.35));
  }

  /* ---- character on the giant phone (lower-right two-thirds of safe square) ---- */
  .char {
    position: absolute;
    left: 478px; top: 543px;
    width: 570px;              /* 570 x 670 — fully inside safe square (bottom 1213) */
    z-index: 2;
    filter: drop-shadow(0 18px 40px rgba(16,35,63,.10));
  }

  /* ---- shared orb + wordmark lockup, bottom-left of safe square ---- */
  .lockup {
    position: absolute;
    left: 76px; top: 1108px;
    display: flex; align-items: center; gap: 16px;
    z-index: 3;
  }
  .lockup img {
    width: 64px; height: 64px;
    filter: drop-shadow(0 5px 12px rgba(47,107,255,.45));
  }
  .lockup span {
    color: #0a1f44;
    font-weight: 800;
    font-size: 44px;
    letter-spacing: -0.02em;
  }
</style>
</head>
<body>
  <div class="blob"></div>
  <img class="orb-companion" src="file:///Users/yonatanzlit/safer-landing/assets/orb.png" alt="">
  <img class="char" src="file:///Users/yonatanzlit/safer-landing/assets/char-watchme.png" alt="">
  <div class="headline">NEVER<br><span class="walk">WALK</span><br>ALONE<span class="dot">.</span></div>
  <div class="sub">When you can&rsquo;t reach them, Safer does.</div>
  <div class="lockup">
    <img src="file:///Users/yonatanzlit/safer-landing/assets/orb.png" alt="">
    <span>Safer</span>
  </div>
</body>
</html>
